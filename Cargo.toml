[package]
name = "memreduct"
version = "0.2.0"
edition = "2021"
description = "Rust rewrite of Henry++ Mem Reduct for Linux"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
libc = "0.2"
eframe = { version = "0.32", optional = true }
egui_plot = { version = "0.32", optional = true }

[features]
default = []
gui = ["dep:eframe", "dep:egui_plot"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_SystemInformation",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_Foundation",
] }
