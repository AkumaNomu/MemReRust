name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # zigbuild gives us a self-contained cross linker for aarch64-musl;
      # fully static output runs unchanged on every glibc/musl distro.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: build
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}
      - name: package
        run: |
          cd target/${{ matrix.target }}/release
          strip memreduct
          tar -czf ../../../memreduct-${{ github.ref_name }}-${{ matrix.target }}.tar.gz memreduct
          cd -
          sha256sum memreduct-${{ github.ref_name }}-${{ matrix.target }}.tar.gz > memreduct-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: memreduct-${{ matrix.target }}
          path: memreduct-*

      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            memreduct-*.tar.gz
            memreduct-*.tar.gz.sha256
          generate_release_notes: true
