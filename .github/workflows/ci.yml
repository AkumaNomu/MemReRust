name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy (warning-free)
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --locked

  musl-static:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: install zig (cross linker)
        run: |
          curl -sL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | tar -xJ
          sudo mv zig-x86_64-linux-0.16.0 /usr/local/zig
          sudo ln -s /usr/local/zig/zig /usr/local/bin/zig
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: build static binary
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}
      - name: smoke test (host arch only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          file target/x86_64-unknown-linux-musl/release/memreduct | grep -q "statically linked"
          ./target/x86_64-unknown-linux-musl/release/memreduct status
          ./target/x86_64-unknown-linux-musl/release/memreduct completions bash > /dev/null
